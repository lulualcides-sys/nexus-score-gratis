name: NEXUS frontend regression
on:
  push:
    paths:
      - 'web/index.html'
      - 'web/match-detail.js'
      - 'web/nexus-evidence-v535.js'
      - 'web/nexus-signal-evaluation.js'
      - 'web/nexus-intelligence-v6.js'
      - 'web/nexus-league-coverage.js'
      - 'tests/test_nexus_league_coverage.mjs'
      - 'web/nexus-intelligence-v6.css'
      - 'tests/test_nexus_intelligence_v6.mjs'
      - 'tests/test_nexus_reconcile.cjs'
      - 'tests/test_nexus_evidence.cjs'
      - 'tests/test_nexus_signal_evaluation.mjs'
      - 'tests/test_nexus_evidence_v535.mjs'
      - 'tests/test_nexus_squads_v539.mjs'
      - 'web/nexus-squads-v539.css'
      - '.github/workflows/nexus-frontend-regression.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript regression and UI smoke
        run: |
          node tests/test_nexus_reconcile.cjs
          node tests/test_nexus_evidence.cjs
          node tests/test_nexus_signal_evaluation.mjs
          node tests/test_nexus_intelligence_v6.mjs
          node tests/test_nexus_league_coverage.mjs
          node tests/test_nexus_evidence_v535.mjs
          node --check tests/test_nexus_squads_v539.mjs
          node tests/test_nexus_squads_v539.mjs
          node --check web/app.js
          node --check web/match-detail.js
          node --check web/nexus-market-quality-v538.js
          node --check web/nexus-evidence-v535.js
          node --check web/nexus-signal-evaluation.js
          node --check web/nexus-intelligence-v6.js
          node --check web/nexus-league-coverage.js
