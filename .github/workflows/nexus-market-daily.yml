name: "NEXUS | Telegram resumo diário"
on:
  schedule:
    # 00h12 BRT (03h12 UTC); arquiva o DIA ANTERIOR, sem enviar Telegram.
    - cron: "12 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-market-telegram
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Testar relatório antes da notificação
        run: |
          python3 -m py_compile telegram_collector/daily.py
          python3 -m unittest discover -s telegram_collector/tests -v
      - name: Ler histórico da branch isolada (sem modificar NEXUS)
        run: |
          git fetch origin market-telegram-data:refs/remotes/origin/market-telegram-data
          git worktree add --no-checkout --detach _market_data origin/market-telegram-data
          git -C _market_data sparse-checkout init --cone
          git -C _market_data sparse-checkout set market-history
          git -C _market_data checkout HEAD
      - name: Gerar resultado diário para o bot existente no Nexus Quant
        run: python3 telegram_collector/daily.py --archive _market_data/market-history --no-telegram
      - name: Arquivar resultado diário na branch de dados
        run: |
          set -euo pipefail
          cd _market_data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-history/daily/
          if ! git diff --cached --quiet; then
            git commit -m "[CF-Pages-Skip] NEXUS market daily Telegram report"
            for attempt in 1 2 3; do
              if git push origin HEAD:market-telegram-data; then
                exit 0
              fi
              git fetch origin market-telegram-data
              git rebase origin/market-telegram-data || exit 1
            done
            exit 1
          fi
