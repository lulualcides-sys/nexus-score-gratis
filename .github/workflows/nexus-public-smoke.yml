name: NEXUS public Cloudflare smoke
on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - 'web/nexus-signal-evaluation.js'
      - 'web/nexus-intelligence-v6.js'
      - 'web/nexus-league-coverage.js'
      - 'web/nexus-intelligence-v6.css'
      - 'web/nexus-evidence-v535.js'
      - 'web/match-detail.js'
      - 'web/nexus-signal-evaluation.css'
      - '.github/workflows/nexus-public-smoke.yml'
  workflow_dispatch:
# Cloudflare Pages publica a versao mais recente; evitar verificacoes de
# commits superados em fila (e falsos atrasos de publicacao).
concurrency:
  group: nexus-cloudflare-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Obter arquivos de origem
        uses: actions/checkout@v4
      - name: Comparar assets públicos com o commit atual
        shell: bash
        run: |
          set -euo pipefail
          base="https://nexus-score-gratis.pages.dev"
          files=(index.html nexus-signal-evaluation.js nexus-evidence-v535.js match-detail.js nexus-signal-evaluation.css nexus-intelligence-v6.js nexus-intelligence-v6.css nexus-league-coverage.js)
          for attempt in $(seq 1 24); do
            found=true
            for filename in "${files[@]}"; do
              path="/${filename}"
              if [[ "${filename}" == "index.html" ]]; then path="/"; fi
              if ! curl -fsSL --connect-timeout 5 --max-time 12 "${base}${path}" -o "/tmp/nexus-${filename}" ||
                 ! cmp -s "web/${filename}" "/tmp/nexus-${filename}"; then
                echo "Tentativa ${attempt}/24: asset divergente/indisponível: ${filename}"
                if [[ "${filename}" == "index.html" ]] && [[ -f "/tmp/nexus-${filename}" ]]; then
                  echo "Origem:"; wc -c "web/${filename}"; sha256sum "web/${filename}"
                  echo "Site:"; wc -c "/tmp/nexus-${filename}"; sha256sum "/tmp/nexus-${filename}"
                  echo "Marcas da origem e do site:"
                  grep -om1 'name="nexus-release-marker"[^>]*' "web/${filename}" || true
                  grep -om1 'name="nexus-release-marker"[^>]*' "/tmp/nexus-${filename}" || true
                fi
                found=false
                break
              fi
            done
            if [[ "${found}" == true ]]; then
              echo "Cloudflare Pages: HTML e 4 assets correspondem byte a byte ao commit ${GITHUB_SHA}."
              exit 0
            fi
            sleep 15
          done
          echo "Cloudflare Pages: versão pública ainda não corresponde ao commit." >&2
          exit 1
