name: "NEXUS | publicar motor de odds próprias na web"
on:
  schedule:
    # 8 atualizações diárias, independentes dos feeds externos de odds.
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/motor-proprio.html"
      - "telegram_collector/model_only.py"
      - "telegram_collector/model_backtest.py"
      - "telegram_collector/league_stats.py"
      - "telegram_collector/predictive_validation.py"
      - ".github/workflows/nexus-model-web.yml"
permissions:
  contents: write
concurrency:
  group: nexus-own-model-web
  cancel-in-progress: false
jobs:
  sync-model:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Buscar somente último cálculo já arquivado
        run: |
          set -euo pipefail
          git fetch --depth=1 origin market-telegram-data:refs/remotes/origin/market-telegram-data
          git show refs/remotes/origin/market-telegram-data:market-history/model-only/latest.json > /tmp/nexus-model-only.json
          # Backtest e estatísticas calculados do mesmo histórico local, sem
          # depender da ordem de execução do coletor periódico em outra branch.
          PYTHONPATH=. python3 -m telegram_collector.model_backtest --history-dir history --archive /tmp/nexus-model-audit
          cp /tmp/nexus-model-audit/model-only/backtest-latest.json /tmp/nexus-model-backtest.json
          cp /tmp/nexus-model-audit/model-only/league-stats-latest.json /tmp/nexus-league-stats.json
      - name: Validar formato e não expor credenciais nem odds de casas
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          source=json.loads(Path("/tmp/nexus-model-only.json").read_text(encoding="utf-8"))
          assert source.get("schema")==1
          assert source.get("model_version","").startswith("nexus-poisson-segmented-")
          assert source.get("source")=="NEXUS independently computed Poisson model"
          matches=source.get("fixtures")
          assert isinstance(matches,list) and len(matches)<=100
          assert source.get("fixtures_priced")==sum(bool(x.get("markets")) for x in matches)
          assert source.get("fixtures_without_model")==sum(not bool(x.get("markets")) for x in matches)
          date=dt.datetime.fromisoformat(source["generated_at"].replace("Z","+00:00"))
          age=(dt.datetime.now(dt.timezone.utc)-date).total_seconds()
          assert -120<=age<12*3600, "modelo está obsoleto"
          for fixture in matches:
              assert fixture.get("not_a_bookmaker_quote") is True
              assert fixture.get("kickoff_utc")
              for k in ("bookmaker","real_bookmaker_odds","api_key","token","secrets"):
                  assert k not in fixture
          Path("web/nexus-model-odds.json").write_text(
              json.dumps(source,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          test=json.loads(Path("/tmp/nexus-model-backtest.json").read_text(encoding="utf-8"))
          assert test.get("schema")==1 and test.get("model_version")==source["model_version"]
          assert test.get("walk_forward") is True
          assert test.get("uses_future_results_in_training") is False
          assert isinstance(test.get("historical_fixtures_tested"),int)
          comparison=test.get("predictive_comparison",{})
          assert comparison.get("production_model_unchanged") is True
          assert comparison.get("promotion_allowed") is False
          assert comparison.get("paired_matches",0)<=test["historical_fixtures_tested"]
          assert comparison.get("leakage_guard","").startswith("Every prior")
          Path("web/nexus-model-backtest.json").write_text(
              json.dumps(test,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          league=json.loads(Path("/tmp/nexus-league-stats.json").read_text(encoding="utf-8"))
          assert league.get("schema")==1 and league.get("status")=="descriptive_only"
          assert league.get("unique_finished_matches",0)>=0
          assert league["half_time_available"]<=league["unique_finished_matches"]
          assert len(league.get("leagues",[]))==league.get("league_count")
          assert sum(l["all"]["matches"] for l in league["leagues"])==league["unique_finished_matches"]
          for l in league["leagues"]:
              ft=l["all"]["ft_1x2"]
              assert ft["home"]+ft["draw"]+ft["away"]==l["all"]["matches"]
              assert l["all"]["ht"]["available_matches"]<=l["all"]["matches"]
          Path("web/nexus-league-stats.json").write_text(
              json.dumps(league,ensure_ascii=False,separators=(",",":"))+"\n",
              encoding="utf-8")
          print("Modelo auditado: " + str(source["fixtures_priced"]) + " jogos; " +
                str(league["league_count"]) + " ligas descritivas")
          PY
      - name: Validar JavaScript isolado do novo painel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path("web/motor-proprio.html").read_text(encoding="utf-8")
          assert text.count("<script>")==1 and text.count("</script>")==1
          script=text.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/nexus-model-browser.js").write_text(script,encoding="utf-8")
          PY
          node --check /tmp/nexus-model-browser.js
      - name: Publicar apenas JSON de probabilidades calculadas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/nexus-model-odds.json web/nexus-model-backtest.json web/nexus-league-stats.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no motor público"
          else
            git commit -m "NEXUS model: publish independent theoretical probabilities"
            # O coletor principal também altera main: rebase sem forçar push.
            for retry in 1 2 3; do
              git fetch --no-tags --depth=50 origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Motor independente publicado com sucesso"
                break
              fi
              if [ "$retry" -eq 3 ]; then
                echo "Não foi possível publicar sem conflito"
                exit 1
              fi
            done
          fi
