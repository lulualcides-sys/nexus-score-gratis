name: "NEXUS — coleta gratuita e histórico"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "coletar.py"
      - "finished_scouts.py"
      - "report_github.py"
      - "odds_capture.py"
      - "pregame_refresh.py"
      - "sofascore_odds.py"
      - "espn_scoreboard_odds.py"
      - "the_odds_api_source.py"
      - "api_football_odds.py"
      - "oddspapi_odds.py"
      - "pregame_refresh_quotes.py"
      - "web_export.py"
      - "team_player_leaders.py"
      - "web/nexus-squads-v539.css"
      - "web/nexus-alert-center-v537.js"
      - "web/nexus-market-quality-v538.js"
      - "tests/test_nexus_triple_patch_v538.mjs"
      - "market_evidence.py"
      - "web/nexus-evidence-v535.js"
      - "web/nexus-evidence-v535.css"
      - "odds_fixture_bridge.py"
      - "signal_registry.py"
      - "backfill.py"
      - "team_form.py"
      - "fotmob_form.py"
      - "fotmob_h2h.py"
      - "standings_context.py"
      - "fotmob_detail_backfill.py"
      - "fotmob_three_days.py"
      - "web/nexus-original-enrich.js"
      - "web/nexus-web-polish.js"
      - "web/nexus-web-polish.css"
      - "web/nexus-iara.js"
      - "web/nexus-iara.css"
      - "multi_source.py"
      - "scout_snapshots.py"
      - "live_momentum.py"
      - "activity_timeline.py"
      - "web/nexus-activity.js"
      - "web/nexus-activity.css"
      - "openfootball_cc0_source.py"
      - "web/index.html"
      - "signal_evaluation.py"
      - "nexus_intelligence_v6.py"
      - "web/nexus-unit-pl.js"
      - "web/nexus-unit-pl.css"
      - "web/nexus-signal-evaluation.js"
      - "web/nexus-signal-evaluation.css"
      - "web/nexus-audit-v532.js"
      - "pregame_audit.py"
      - "web/app.js"
      - "web/match-detail.js"
      - "web/match-detail.css"
      - "web/style.css"
      - "web/pc.js"
      - "pc_reader.py"
      - "web_server.py"
      - "tests/**"
      - ".github/workflows/nexus-gratis.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obter código e histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar versão Python
        run: python3 --version
      - name: Validar integracao e privacidade (sem dependencias pagas)
        run: |
          python3 -m py_compile market_evidence.py nexus_intelligence_v6.py oddspapi_odds.py api_football_odds.py pregame_audit.py signal_registry.py pc_reader.py web_server.py odds_capture.py pregame_refresh.py sofascore_odds.py espn_scoreboard_odds.py the_odds_api_source.py pregame_refresh_quotes.py web_export.py odds_fixture_bridge.py coletar.py backfill.py team_form.py fotmob_form.py fotmob_detail_backfill.py fotmob_three_days.py finished_scouts.py standings_context.py multi_source.py fotmob_h2h.py signal_evaluation.py openfootball_cc0_source.py scout_snapshots.py live_momentum.py activity_timeline.py
          python3 -m unittest discover -s tests -v
          node --check web/nexus-audit-v532.js
          node tests/test_nexus_audit_v532.mjs
          node tests/test_nexus_prelive_archive_v540.mjs
          node tests/test_hot_alerts_v533.mjs
          node tests/test_classic_projections_v534.mjs
          node --check web/nexus-evidence-v535.js
          node tests/test_nexus_evidence_v535.mjs
          node tests/test_nexus_triple_patch_v538.mjs
          node tests/test_nexus_squads_v539.mjs
          node --check web/nexus-alert-center-v537.js
          node --check web/nexus-market-quality-v538.js
          node --check web/app.js
          node --check web/match-detail.js
          node --check web/nexus-original-enrich.js
          node --check web/nexus-web-polish.js
          node tests/test_nexus_web_polish.mjs
          node tests/test_web_detail.mjs
          node tests/test_original_enrich.mjs
          node tests/test_pregame_web.mjs
          node tests/test_live_timeline.mjs
          node tests/test_live_scout_history.mjs
          node tests/test_nexus_activity.mjs
          node --check web/nexus-iara.js
          node tests/test_nexus_iara.mjs
          node tests/test_iara_bridge.mjs
          node --check web/nexus-unit-pl.js
          node --check web/nexus-signal-evaluation.js
          node tests/test_nexus_unit_pl.mjs
          node tests/test_nexus_signal_evaluation.mjs
      - name: Coletar partidas públicas e pressão
        id: collect
        continue-on-error: true
        run: python3 coletar.py
      - name: Capturar jogos FotMob dos 3 dias em Brasília
        id: fotmob_days
        continue-on-error: true
        run: python3 fotmob_three_days.py
      - name: Retrocoletar jogos de hoje e dois dias anteriores e scouts ESPN
        id: backfill
        continue-on-error: true
        run: python3 backfill.py
      - name: Cruzar OpenLigaDB e Football-Data somente com permissao
        id: multi_source
        continue-on-error: true
        run: python3 multi_source.py
      - name: Auditar placares FT no OpenFootball CC0 (sem sobrepor resultados)
        id: cc0_check
        continue-on-error: true
        run: python3 openfootball_cc0_source.py
      - name: Coletar historico dos dez jogos anteriores por equipe
        id: team_form
        continue-on-error: true
        run: python3 team_form.py
      - name: Complementar scouts e eventos de partidas encerradas (FotMob)
        id: detail_backfill
        continue-on-error: true
        run: python3 fotmob_detail_backfill.py
      - name: Coletar os dez jogos anteriores de times FotMob e seus elencos
        id: fotmob_form
        continue-on-error: true
        run: python3 fotmob_form.py
      - name: Conferir confronto direto completo no FotMob (cache seguro)
        continue-on-error: true
        run: python3 fotmob_h2h.py
      - name: Enriquecer classificação real e Must Win
        continue-on-error: true
        run: python3 standings_context.py
      - name: Complemento de scouts FotMob em jogos encerrados
        continue-on-error: true
        run: python3 finished_scouts.py
      - name: Capturar odds pré-jogo e liquidar previsões congeladas
        id: odds
        if: always()
        continue-on-error: true
        run: python3 odds_capture.py
      - name: Congelar cenários pré-live e conferir desfechos esportivos
        if: always()
        run: python3 pregame_audit.py
      - name: Registrar alertas e conferir gols na nuvem
        if: always()
        run: python3 signal_registry.py
      - name: Atualizar painel dos mercados monitorados
        if: always()
        run: python3 report_github.py
      - name: Exportar a cada coleta para evitar dados web defasados
        if: always()
        run: python3 web_export.py
      - name: Guardar resultados e status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp history/signal_registry.json /tmp/nexus-local-signals.json || true
          git fetch origin main
          python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
          python3 web_export.py
          git add history/ web/data.json web/listing.json
          if ! git diff --cached --quiet; then
            if git diff --cached --name-only | grep -q '^web/'; then
              git commit -m "NEXUS Web: atualiza partidas públicas"
            else
              git commit -m "[CF-Pages-Skip] NEXUS: atualiza histórico privado"
            fi
            # Alterações de código podem ter sido enviadas durante a coleta.
            # Rebase preserva commits remotos de código; em conflitos de
            # snapshots history/data, prefere a coleta concluída neste job.
            pushed=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git fetch origin main
              git rebase -X theirs origin/main || {
                git rebase --abort || true
                echo "Falha ao reconciliar commits remotos na tentativa $attempt"
                exit 1
              }
              python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
              python3 web_export.py
              git add history/signal_registry.json web/data.json web/listing.json
              if ! git diff --cached --quiet; then
                git commit -m "NEXUS: mescla alertas da nuvem sem perdas"
              fi
              sleep 1
            done
            if [[ "$pushed" != true ]]; then
              echo "Quatro tentativas de push falharam"
              exit 1
            fi
          fi
      - name: Exibir falha de fonte quando ocorrer
        if: steps.collect.outcome == 'failure'
        run: echo "Fonte indisponível ou coletor falhou; consulte history/status.json."
