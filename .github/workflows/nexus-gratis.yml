name: "NEXUS — coleta gratuita e histórico"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "coletar.py"
      - "report_github.py"
      - "odds_capture.py"
      - "web_export.py"
      - "backfill.py"
      - "web/index.html"
      - "web/app.js"
      - "web/style.css"
      - "web/pc.js"
      - "pc_reader.py"
      - "web_server.py"
      - "tests/**"
      - ".github/workflows/nexus-gratis.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obter código e histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar versão Python
        run: python3 --version
      - name: Validar integracao e privacidade (sem dependencias pagas)
        run: |
          python3 -m py_compile pc_reader.py web_server.py odds_capture.py web_export.py coletar.py backfill.py
          python3 -m unittest discover -s tests -v
      - name: Coletar partidas públicas e pressão
        id: collect
        continue-on-error: true
        run: python3 coletar.py
      - name: Retrocoletar tres dias de jogos e scouts da ESPN
        id: backfill
        continue-on-error: true
        run: python3 backfill.py
      - name: Capturar odds pré-jogo e liquidar previsões congeladas
        id: odds
        if: always()
        continue-on-error: true
        run: python3 odds_capture.py
      - name: Atualizar painel dos mercados monitorados
        if: always()
        run: python3 report_github.py
      - name: Exportar dados seguros para o site a cada duas horas
        if: always()
        shell: bash
        run: |
          hour=$(date -u +%H)
          if [[ ! -f web/data.json ]] || (( 10#$hour % 2 == 0 )); then
            python3 web_export.py
          else
            echo "Snapshot web mantido: atualização a cada duas horas UTC."
          fi
      - name: Guardar resultados e status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/ web/data.json
          if ! git diff --cached --quiet; then
            if git diff --cached --name-only | grep -q '^web/'; then
              git commit -m "NEXUS Web: atualiza partidas públicas"
            else
              git commit -m "[CF-Pages-Skip] NEXUS: atualiza histórico privado"
            fi
            git push
          fi
      - name: Exibir falha de fonte quando ocorrer
        if: steps.collect.outcome == 'failure'
        run: echo "Fonte indisponível ou coletor falhou; consulte history/status.json."
