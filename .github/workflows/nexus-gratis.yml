name: "NEXUS — coleta gratuita e histórico"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "coletar.py"
      - "report_github.py"
      - "odds_capture.py"
      - "web_export.py"
      - "backfill.py"
      - "team_form.py"
      - "fotmob_form.py"
      - "fotmob_detail_backfill.py"
      - "web/nexus-original-enrich.js"
      - "multi_source.py"
      - "web/index.html"
      - "web/app.js"
      - "web/match-detail.js"
      - "web/match-detail.css"
      - "web/style.css"
      - "web/pc.js"
      - "pc_reader.py"
      - "web_server.py"
      - "tests/**"
      - ".github/workflows/nexus-gratis.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obter código e histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar versão Python
        run: python3 --version
      - name: Validar integracao e privacidade (sem dependencias pagas)
        run: |
          python3 -m py_compile pc_reader.py web_server.py odds_capture.py web_export.py coletar.py backfill.py team_form.py fotmob_form.py fotmob_detail_backfill.py multi_source.py
          python3 -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/match-detail.js
          node tests/test_web_detail.mjs
      - name: Coletar partidas públicas e pressão
        id: collect
        continue-on-error: true
        run: python3 coletar.py
      - name: Retrocoletar jogos de hoje e dois dias anteriores e scouts ESPN
        id: backfill
        continue-on-error: true
        run: python3 backfill.py
      - name: Cruzar Football-Data e OpenLigaDB com fontes principais
        id: multi_source
        continue-on-error: true
        run: python3 multi_source.py
      - name: Coletar historico dos dez jogos anteriores por equipe
        id: team_form
        continue-on-error: true
        run: python3 team_form.py
      - name: Complementar scouts e eventos de partidas encerradas (FotMob)
        id: detail_backfill
        continue-on-error: true
        run: python3 fotmob_detail_backfill.py
      - name: Coletar os dez jogos anteriores de times FotMob e seus elencos
        id: fotmob_form
        continue-on-error: true
        run: python3 fotmob_form.py
      - name: Capturar odds pré-jogo e liquidar previsões congeladas
        id: odds
        if: always()
        continue-on-error: true
        run: python3 odds_capture.py
      - name: Atualizar painel dos mercados monitorados
        if: always()
        run: python3 report_github.py
      - name: Exportar no push e a cada duas horas no agendamento
        if: always()
        shell: bash
        run: |
          hour=$(date -u +%H)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] || [[ ! -f web/data.json ]] || (( 10#$hour % 2 == 0 )) || ! grep -q '"schema":2' web/data.json; then
            python3 web_export.py
          else
            echo "Snapshot web mantido: atualização a cada duas horas UTC."
          fi
      - name: Guardar resultados e status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/ web/data.json
          if ! git diff --cached --quiet; then
            if git diff --cached --name-only | grep -q '^web/'; then
              git commit -m "NEXUS Web: atualiza partidas públicas"
            else
              git commit -m "[CF-Pages-Skip] NEXUS: atualiza histórico privado"
            fi
            git push
          fi
      - name: Exibir falha de fonte quando ocorrer
        if: steps.collect.outcome == 'failure'
        run: echo "Fonte indisponível ou coletor falhou; consulte history/status.json."
