name: "NEXUS — coleta gratuita e histórico"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "coletar.py"
      - "report_github.py"
      - "odds_capture.py"
      - ".github/workflows/nexus-gratis.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obter código e histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar versão Python
        run: python3 --version
      - name: Coletar partidas públicas e pressão
        id: collect
        continue-on-error: true
        run: python3 coletar.py
      - name: Capturar odds pré-jogo e liquidar previsões congeladas
        id: odds
        if: always()
        continue-on-error: true
        run: python3 odds_capture.py
      - name: Atualizar painel dos mercados monitorados
        if: always()
        run: python3 report_github.py
      - name: Guardar resultados e status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/
          if ! git diff --cached --quiet; then
            git commit -m "NEXUS: histórico da coleta #${{ github.run_number }}"
            git push
          fi
      - name: Exibir falha de fonte quando ocorrer
        if: steps.collect.outcome == 'failure'
        run: echo "Fonte indisponível ou coletor falhou; consulte history/status.json."
