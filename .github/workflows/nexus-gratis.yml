name: "NEXUS — coleta gratuita e histórico"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Obter código e histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar versão Python
        run: python3 --version
      - name: Coletar partidas públicas e pressão
        run: python3 coletar.py
      - name: Guardar resultados e status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/
          if ! git diff --cached --quiet; then
            git commit -m "NEXUS: histórico da coleta #${{ github.run_number }}"
            git push
          fi
