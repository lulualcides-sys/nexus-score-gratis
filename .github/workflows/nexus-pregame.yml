name: "NEXUS — escalações e odds pré-jogo"
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pregame_refresh.py"
      - "signal_registry.py"
      - "standings_context.py"
      - "sofascore_odds.py"
      - ".github/workflows/nexus-pregame.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ler o NEXUS e seu histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar rotina
        run: |
          python3 -m py_compile signal_registry.py pregame_refresh.py sofascore_odds.py standings_context.py
          python3 -m unittest discover -s tests -v
          node --check web/nexus-original-enrich.js
          node tests/test_original_enrich.mjs
      - name: Buscar escalações e odds sem preços inventados
        run: python3 pregame_refresh.py
      - name: Atualizar a situação das equipes na tabela
        continue-on-error: true
        run: python3 standings_context.py
      - name: Registrar alertas e conferir gols na nuvem
        run: python3 signal_registry.py
      - name: Publicar dados quando houver mudança esportiva
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- history/20??-??-??.json history/signal_registry.json)" ]]; then
            echo "Nenhuma alteração de escalacao/odds nesta janela."
            exit 0
          fi
          python3 web_export.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp history/signal_registry.json /tmp/nexus-local-signals.json || true
          git fetch origin main
          python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
          python3 web_export.py
          git add history/ web/data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NEXUS: escalações/odds pre-jogo atualizadas"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort || true
              exit 1
            }
            python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
            python3 web_export.py
            git add history/signal_registry.json web/data.json
            if ! git diff --cached --quiet; then
              git commit -m "NEXUS: mescla alertas da nuvem sem perdas"
            fi
            sleep 2
          done
          exit 1
