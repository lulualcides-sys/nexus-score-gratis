name: "NEXUS — escalações e odds pré-jogo"
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pregame_refresh.py"
      - "pregame_audit.py"
      - "coletar.py"
      - "scout_snapshots.py"
      - "live_momentum.py"
      - "activity_timeline.py"
      - "web_export.py"
      - "web/nexus-alert-center-v537.js"
      - "web/nexus-market-quality-v538.js"
      - "tests/test_nexus_triple_patch_v538.mjs"
      - "market_evidence.py"
      - "odds_fixture_bridge.py"
      - "signal_registry.py"
      - "standings_context.py"
      - "sofascore_odds.py"
      - "espn_scoreboard_odds.py"
      - "the_odds_api_source.py"
      - "api_football_odds.py"
      - "pregame_refresh_quotes.py"
      - ".github/workflows/nexus-pregame.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o NEXUS e seu histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar rotina
        run: |
          python3 -m py_compile market_evidence.py api_football_odds.py pregame_audit.py signal_registry.py pregame_refresh.py sofascore_odds.py espn_scoreboard_odds.py the_odds_api_source.py pregame_refresh_quotes.py standings_context.py coletar.py web_export.py odds_fixture_bridge.py scout_snapshots.py live_momentum.py activity_timeline.py
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then python3 -m unittest discover -s tests -v; fi
          node --check web/nexus-audit-v532.js
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_audit_v532.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_classic_projections_v534.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_evidence_v535.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_triple_patch_v538.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_squads_v539.mjs; fi
          node --check web/nexus-alert-center-v537.js
          node --check web/nexus-market-quality-v538.js
          node --check web/nexus-original-enrich.js
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_original_enrich.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_live_scout_history.mjs; fi
      - name: Atualizar scouts reais e placares ao vivo (melhor esforço)
        continue-on-error: true
        env:
          NEXUS_MODE: live
        run: python3 coletar.py
      - name: Buscar escalações e odds de múltiplas fontes sem preços inventados
        env:
          NEXUS_THE_ODDS_API_KEY: ${{ secrets.NEXUS_THE_ODDS_API_KEY }}
          NEXUS_API_FOOTBALL_KEY: ${{ secrets.NEXUS_API_FOOTBALL_KEY }}
        run: python3 pregame_refresh.py
      - name: Congelar e verificar previsões anteriores ao jogo
        run: python3 pregame_audit.py
      - name: Atualizar a situação das equipes na tabela
        continue-on-error: true
        run: python3 standings_context.py
      - name: Registrar alertas e conferir gols na nuvem
        run: python3 signal_registry.py
      - name: Publicar dados quando houver mudança esportiva
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- history/20??-??-??.json history/signal_registry.json)" ]]; then
            echo "Nenhuma alteração esportiva nesta janela."
            exit 0
          fi
          python3 web_export.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp history/signal_registry.json /tmp/nexus-local-signals.json || true
          git fetch origin main
          python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
          python3 web_export.py
          git add history/ web/data.json web/listing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NEXUS: escalações/odds pre-jogo atualizadas"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort || true
              exit 1
            }
            python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
            python3 web_export.py
            git add history/signal_registry.json web/data.json web/listing.json
            if ! git diff --cached --quiet; then
              git commit -m "NEXUS: mescla alertas da nuvem sem perdas"
            fi
            sleep 2
          done
          exit 1
