name: "NEXUS — escalações e odds pré-jogo"
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pregame_refresh.py"
      - "pregame_audit.py"
      - "coletar.py"
      - "scout_snapshots.py"
      - "live_momentum.py"
      - "activity_timeline.py"
      - "web_export.py"
      - "web/nexus-alert-center-v537.js"
      - "web/nexus-market-quality-v538.js"
      - "tests/test_nexus_triple_patch_v538.mjs"
      - "market_evidence.py"
      - "odds_fixture_bridge.py"
      - "signal_registry.py"
      - "standings_context.py"
      - "sofascore_odds.py"
      - "espn_scoreboard_odds.py"
      - "the_odds_api_source.py"
      - "api_football_odds.py"
      - "oddspapi_odds.py"
      - "oddspapi_historical.py"
      - "source_health.py"
      - "tests/test_nexus_source_health_v547.mjs"
      - "tests/test_oddspapi_historical.py"
      - "pregame_refresh_quotes.py"
      - ".github/workflows/nexus-pregame.yml"
permissions:
  contents: write
concurrency:
  group: nexus-history
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o NEXUS e seu histórico
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Diagnosticar autenticação OddsPapi (sem consumir cota)
        if: github.event_name != 'schedule'
        env:
          NEXUS_ODDSPAPI_KEY: ${{ secrets.NEXUS_ODDSPAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError, URLError
          key = os.environ.get('NEXUS_ODDSPAPI_KEY', '').strip()
          if not key:
              print('ODDSPAPI_DIAG: missing_secret')
              raise SystemExit(0)
          url = 'https://api.oddspapi.io/v4/account?' + urlencode({'apiKey': key})
          try:
              with urlopen(Request(url, headers={'Accept': 'application/json'}), timeout=15) as reply:
                  account = json.load(reply)
              if not isinstance(account, dict) or not isinstance(account.get('subscriptions'), list):
                  print('ODDSPAPI_DIAG: authenticated_but_unexpected_account_format')
              else:
                  active = next((s for s in account['subscriptions'] if isinstance(s, dict) and s.get('is_active') is True), {})
                  books = active.get('bookmakers') or {}
                  sports = active.get('sport_ids') or []
                  public = {
                      'status': 'authenticated',
                      'subscription_active': bool(active),
                      'soccer_access': 10 in sports,
                      'bookmakers_enabled': [b for b in ('betano.bet.br', 'pinnacle', 'bet365') if b in books],
                      'request_limit': active.get('request_limit'),
                      'request_count': active.get('request_count')
                  }
                  print('ODDSPAPI_DIAG: ' + json.dumps(public, sort_keys=True))
          except HTTPError as error:
              print('ODDSPAPI_DIAG: http_error_' + str(error.code))
          except (URLError, TimeoutError, ValueError, TypeError):
              print('ODDSPAPI_DIAG: request_unavailable_or_invalid_response')
          PY
      - name: Validar rotina
        run: |
          python3 -m py_compile market_evidence.py oddspapi_odds.py oddspapi_historical.py source_health.py api_football_odds.py pregame_audit.py signal_registry.py pregame_refresh.py sofascore_odds.py espn_scoreboard_odds.py the_odds_api_source.py pregame_refresh_quotes.py standings_context.py coletar.py web_export.py odds_fixture_bridge.py scout_snapshots.py live_momentum.py activity_timeline.py
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then python3 -m unittest discover -s tests -v; fi
          node --check web/nexus-audit-v532.js
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_audit_v532.mjs
          node tests/test_nexus_prelive_archive_v540.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_classic_projections_v534.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_evidence_v535.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_triple_patch_v538.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_squads_v539.mjs; fi
          node --check web/nexus-alert-center-v537.js
          node --check web/nexus-market-quality-v538.js
          node --check web/nexus-original-enrich.js
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_nexus_odds_comparison_v541.mjs; node tests/test_nexus_historical_audit_v542.mjs; node tests/test_nexus_source_health_v547.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_original_enrich.mjs; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then node tests/test_live_scout_history.mjs; fi
      - name: Atualizar scouts reais e placares ao vivo (melhor esforço)
        continue-on-error: true
        env:
          NEXUS_MODE: live
        run: python3 coletar.py
      - name: Buscar escalações e odds de múltiplas fontes sem preços inventados
        env:
          NEXUS_THE_ODDS_API_KEY: ${{ secrets.NEXUS_THE_ODDS_API_KEY }}
          NEXUS_API_FOOTBALL_KEY: ${{ secrets.NEXUS_API_FOOTBALL_KEY }}
          NEXUS_ODDSPAPI_KEY: ${{ secrets.NEXUS_ODDSPAPI_KEY }}
        run: python3 pregame_refresh.py
      - name: Historico OddsPapi auditavel (endpoint gratuito, maximo 2/dia)
        env:
          NEXUS_ODDSPAPI_KEY: ${{ secrets.NEXUS_ODDSPAPI_KEY }}
        run: python3 oddspapi_historical.py
      - name: Congelar e verificar previsões anteriores ao jogo
        run: python3 pregame_audit.py
      - name: Atualizar a situação das equipes na tabela
        continue-on-error: true
        run: python3 standings_context.py
      - name: Registrar alertas e conferir gols na nuvem
        run: python3 signal_registry.py
      - name: Publicar dados quando houver mudança esportiva
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- history/20??-??-??.json history/signal_registry.json history/oddspapi_usage.json history/oddspapi_historical_status.json history/pregame_refresh_status.json)" ]]; then
            echo "Nenhuma alteração esportiva nesta janela."
            exit 0
          fi
          python3 web_export.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp history/signal_registry.json /tmp/nexus-local-signals.json || true
          git fetch origin main
          python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
          python3 web_export.py
          git add history/ web/data.json web/listing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NEXUS: escalações/odds pre-jogo atualizadas"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort || true
              exit 1
            }
            python3 signal_registry.py --merge-remote /tmp/nexus-local-signals.json
            python3 web_export.py
            git add history/signal_registry.json web/data.json web/listing.json
            if ! git diff --cached --quiet; then
              git commit -m "NEXUS: mescla alertas da nuvem sem perdas"
            fi
            sleep 2
          done
          exit 1
